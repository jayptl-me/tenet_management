name: tenet_pg_portal
description: Role-based Tenet PG portal for tenants, guardians, and visitors (mobile + web).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.4.0
  dio: ^5.8.0+1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  equatable: ^2.0.7
  google_fonts: ^8.2.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
